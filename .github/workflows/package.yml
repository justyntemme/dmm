name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Decky package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            decky/package-lock.json

      - name: Build package
        run: make package

      - name: Write checksums
        run: |
          cd dist
          sha256sum decky-mod-manager.tar.gz decky-mod-manager.zip > decky-mod-manager-checksums.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-mod-manager-package
          path: |
            dist/decky-mod-manager.tar.gz
            dist/decky-mod-manager.zip
            dist/decky-mod-manager-checksums.txt
          if-no-files-found: error

      - name: Publish development release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="dev-latest"
          short_sha="$(git rev-parse --short HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${release_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${release_tag}" --force

          notes="Automated Decky Mod Manager development build from main at ${GITHUB_SHA}."
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" --title "Latest main build (${short_sha})" --notes "${notes}"
          else
            gh release create "${release_tag}" --verify-tag --title "Latest main build (${short_sha})" --notes "${notes}"
          fi
          gh release upload "${release_tag}" \
            dist/decky-mod-manager.tar.gz \
            dist/decky-mod-manager.zip \
            dist/decky-mod-manager-checksums.txt \
            --clobber
