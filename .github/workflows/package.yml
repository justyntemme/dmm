name: Package

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  package:
    name: Build Decky package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            decky/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build package
        run: make package REQUIRE_LOOT_SORTER=1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-mod-manager-package
          path: |
            dist/decky-mod-manager.tar.gz
            dist/decky-mod-manager.zip
          if-no-files-found: error

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          short_sha="$(git rev-parse --short HEAD)"

          notes="Decky Mod Manager ${release_tag} built from ${GITHUB_SHA}."
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" --title "Decky Mod Manager ${release_tag} (${short_sha})" --notes "${notes}"
          else
            gh release create "${release_tag}" --verify-tag --title "Decky Mod Manager ${release_tag} (${short_sha})" --notes "${notes}"
          fi
          gh release upload "${release_tag}" \
            dist/decky-mod-manager.tar.gz \
            dist/decky-mod-manager.zip \
            --clobber
