name: Package

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DMM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned Vortex source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Nexus-Mods/Vortex
          ref: c57894eb71af8234b58a6bd15ae5ab543eccac3a
          path: vortex-source

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            decky/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci && npm --prefix decky ci

      - name: Verify pinned Vortex parity inventory
        env:
          DMM_VORTEX_SOURCE: ${{ github.workspace }}/vortex-source
        run: make vortex-parity

      - name: Run Go tests
        run: make test

      - name: Run Go static analysis
        run: go vet ./...

      - name: Run Go race tests
        run: make test-race

      - name: Check and build phone UI
        run: npm --prefix web run check && npm --prefix web run build

      - name: Build Decky UI
        run: npm --prefix decky run build

      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=high && npm audit --prefix decky --audit-level=high

      - name: Test LOOT helper
        run: cargo test --manifest-path helpers/loot-sorter/Cargo.toml

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile decky/main.py testing/dmm_test_auth.py
          python3 -m unittest testing/test_decky_updater.py
          find testing -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run UI behavior audit
        run: ./testing/ui_mvp_audit.sh

      - name: Run backend smoke test
        run: ./testing/local_smoke.sh

  package:
    name: Build Decky package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            decky/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build package
        run: make package REQUIRE_LOOT_SORTER=1 BUILD_CHANNEL="${GITHUB_REF_NAME}"

      - name: Smoke test package shape
        run: PACKAGE=dist/decky-mod-manager.tar.gz SHAPE_ONLY=1 REQUIRE_LOOT_SORTER=1 ./testing/deck_package_smoke.sh

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum decky-mod-manager.tar.gz decky-mod-manager.zip > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decky-mod-manager-package
          path: |
            dist/decky-mod-manager.tar.gz
            dist/decky-mod-manager.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          short_sha="$(git rev-parse --short HEAD)"

          notes="Decky Mod Manager ${release_tag} built from ${GITHUB_SHA}."
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" --title "Decky Mod Manager ${release_tag} (${short_sha})" --notes "${notes}"
          else
            gh release create "${release_tag}" --verify-tag --title "Decky Mod Manager ${release_tag} (${short_sha})" --notes "${notes}"
          fi
          gh release upload "${release_tag}" \
            dist/decky-mod-manager.tar.gz \
            dist/decky-mod-manager.zip \
            dist/SHA256SUMS \
            --clobber
